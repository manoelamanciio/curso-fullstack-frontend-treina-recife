<!DOCTYPE html>

<html lang="pt-br">

<head>
    <title>Página Inicial</title>
    <meta charset="UTF-8">


    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/style.css">
</head>

<body style="background-color: #031f31;">


    <main>

        <nav class="menu-horizontal">
            <ul>
                <div class="color-div">
                    <li><a href="dashboard.html">Dashboard</a><span class="material-icons">dashboard</span></li>
                </div>

                <div class="color-div">
                    <li><a href="projeto.html">Projetos</a><span class="material-icons">list_alt</li>
                </div>

                <div class="color-div">
                    <li><a href="tarefa.html">Tarefas</a></li>
                </div>

                <div class="color-div">
                    <li><a href="usuario.html">Usuários</a></li>
                </div>
            </ul>

        </nav>

        <div class="titulo1">
            <h1 id="titulo-user">Adicionar Novo Usuário</h1>
        </div>

        <div class="form-principal">
            <form>

                <label for="nome">Nome:</label>
                <span class="ast">*</span>
                <br>
                <input type="text" id="nome" name="nome" class="form-usuario">

                <br><br>

                <label for="cpf">CPF:</label>
                <span class="ast">*</span>
                <br>
                <input type="number" id="cpf" name="cpf" maxlength="11" pattern="[0-9]{11}"  class="form-usuario">

                <br><br>

                <label for="email">E-mail:</label>
                <span class="ast">*</span>
                <br>
                <input type="email" id="email" name="email"  class="form-usuario">

                <br><br>

                <label for="dataNascimento">Data de Nascimento:</label>
                <span class="ast">*</span>
                <br>
                <input type="date" id="dataNascimento" name="dataNascimento">

                <br><br>

                <label for="status">Status:</label>
                <span class="ast">*</span>
                <br>

                <select id="status" name="status">
                    <option value="">Selecione o status</option>
                    <option value="Ativo">Ativo</option>
                    <option value="Inativo">Inativo</option>
                    <option value="Pendente">Pendente</option>
                </select>

                <br><br>

                <label for="senha">Senha temporária:</label>
                <span class="ast">*</span>
                <br>

                <input type="password" id="senha" name="senha" minlength="8" required>

                <br><br>

                <button style="background-color: green; color: white;" type="submit">
                    Adicionar um usuário
                </button>

                <br><br>

                <button style="background-color: red; color: white;" type="reset">
                    Cancelar
                </button>

            </form>
        </div>
        <div>
            <a href="#titulo-user" class="btn-top">Subir para o topo</a>
        </div>


    </main>

    <footer>
    </footer>

</body>

</html>
