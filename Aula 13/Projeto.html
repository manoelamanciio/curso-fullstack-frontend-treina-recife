<!DOCTYPE html>

<html lang="pt-br">

<head>
    <title>sistema de Gestão de Projetos - Projetos</title>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
    <link rel="stylesheet" href="css/bootstrap.css">
    <link rel="stylesheet" href="css/style.css">

</head>

<body class="background">

    <header class="links">
    </header>

    <main>

        <nav class="menu-horizontal">
            <ul>
                <div class="color-div">
                    <li><a href="dashboard.html"><span class="material-icons">dashboard</span>Dashboard</a></li>
                </div>

                <div class="color-div">
                    <li><a href="tarefa.html"><span class="material-icons">share</span>Tarefas</a></li>
                </div>


                <div class="color-div">
                    <li><a href="projeto.html"><span class="material-icons">list_alt</span>Projetos</a></li>
                </div>

                <div class="color-div">
                    <li><a href="usuario.html"><span class="material-icons">group</span>Usuários</a></li>
                </div>
            </ul>

        </nav>
        <div class="area-projeto">

            <div class="titulo-form">
                <h1>Adicionar Novo Projeto</h1>
            </div>

            <div class="form-principal">
                <form>

                    <label for="nome">Nome do Projeto:</label>
                    <span class="ast">*</span>
                    <br>

                    <input type="text" id="nome" name="nome" class="form-usuario">

                    <br><br>

                    <label for="descricao">Descrição:</label>
                    <br>

                    <textarea id="descricao" name="descricao" class="form-usuario">
            </textarea>

                    <br><br>

                    <div class="alinhar-campos">
                        <div class="coluna">
                            <label for="dataCriacao">Data de criação:</label>
                            <span class="ast">*</span>
                            <input type="date" id="dataCriacao" name="dataCriacao" class="form-usuario">
                        </div>


                        <div class="coluna">
                            <label for="dataConclusao">Data de conclusão:</label>
                            <span class="ast">*</span>
                            <input type="date" id="dataConclusao" name="dataConclusao" class="form-usuario">
                        </div>

                    </div>


                    <div class="alinhar-campos">
                        <div class="coluna">
                            <label for="status">Status:</label>
                            <span class="ast">*</span>
                            <select id="status" name="status" class="form-usuario">
                                <option value="">Selecione</option>
                                <option value="Pendente">Pendente</option>
                                <option value="Em andamento">Em andamento</option>
                                <option value="Concluído">Concluído</option>
                                <option value="Entregue">Entregue</option>
                            </select>
                        </div>

                        <div class="coluna">
                            <label for="responsavel">Responsável:</label>
                            <span class="ast">*</span>
                            <input type="text" id="responsavel" name="responsavel" class="form-usuario">
                        </div>
                    </div>
                    <br>

                    <button type="button" class="btn btn-success" onclick="projeto()">
                        Salvar
                    </button>

                    <br><br>

                    <button type="reset" class="btn btn-danger">
                        Cancelar
                    </button>

                </form>
            </div>

    </main>

    <footer>
    </footer>

    <script src="js/Projeto.js"></script>
</body>

</html>
