<!DOCTYPE html>

<html lang="pt-br">

<head>
    <title>Página Inicial</title>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css">

    <style>
        #d01 {
            font-size: 15px;
        }

        .ast {
            color: red;
        }
    </style>
</head>

<body>

    <header>
        <nav style="width: 100%; background-color: white;">
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="tarefas.html">Tarefas</a></li>
                <li><a href="usuarios.html">Usuários</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1 class="teste">Adicionar Nova Tarefa</h1>

        <form>

            <label class="titulo" for="titulo">Título:</label>
            <span class="ast">*</span>
            <br>
            <input type="text" id="titulo" name="titulo">
            <br><br>

            <label for="prioridade">Prioridade:</label>
            <span class="ast">*</span>
            <br>

            <select id="prioridade" name="prioridade">
                <option value="">Selecione</option>
                <option value="Alta">Alta</option>
                <option value="Média">Média</option>
                <option value="Baixa">Baixa</option>
            </select>

            <br><br>

            <label for="responsavel">Responsável:</label>
            <span class="ast">*</span>
            <br>
            <input type="text" id="responsavel" name="responsavel">

            <br><br>

            <label for="descricao">Descrição:</label>
            <span class="ast">*</span>
            <br>
            <textarea id="descricao" name="descricao"></textarea>

            <br><br>

            <label for="dataCriacao">Data de criação:</label>
            <span class="ast">*</span>
            <br>
            <input type="date" id="dataCriacao" name="dataCriacao">

            <br><br>

            <label for="dataConclusao">Data de conclusão:</label>
            <span class="ast">*</span>
            <br>
            <input type="date" id="dataConclusao" name="dataConclusao">

            <br><br>

            <label for="status">Status:</label>
            <span class="ast">*</span>
            <br>

            <select id="status" name="status">
                <option value="">Selecione</option>
                <option value="Pendente">Pendente</option>
                <option value="Em andamento">Em andamento</option>
                <option value="Concluído">Concluído</option>
                <option value="Entregue">Entregue</option>
            </select>

            <br><br>

            <label for="projeto">Projeto:</label>
            <span class="ast">*</span>
            <br>

            <select id="projeto" name="projeto">
                <option value="">Selecione</option>
                <option value="Website">Website</option>
                <option value="Aplicativo">Aplicativo</option>
                <option value="Sistema interno">Sistema interno</option>
                <option value="Outro">Outro</option>
            </select>

            <br><br>

            <label for="lembrete">Definir lembrete</label>
            <input type="checkbox" id="lembrete" name="lembrete">

            <br><br>

            <button style="background-color: green; color: white;" type="submit">
                Salvar
            </button>

            <br><br>

            <button style="background-color: red; color: white;" type="reset">
                Cancelar
            </button>

        </form>

    </main>

    <footer>
    </footer>

</body>

</html>
