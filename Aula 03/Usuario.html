<!DOCTYPE html>

<html lang="pt-br">

<head>
    <title>Página Inicial</title>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/style.css">

    <style>
        .ast1 {
            color: red;
        }
    </style>
</head>

<body style="background-color: white;">

    <header>
        <nav style="width: 100%; background-color: white;">
            <ul>
                <li><a href="dashboard.html">Dashboard</a></li>
                <li><a href="projetos.html">Projetos</a></li>
                <li><a href="tarefas.html">Tarefas</a></li>
                <li><a href="usuarios.html">Usuários</a></li>
            </ul>
        </nav>
    </header>

    <main>

        <h1 class="teste">Adicionar Novo Usuário</h1>

        <form>

            <label for="nome">Nome:</label>
            <span class="ast1">*</span>
            <br>
            <input type="text" id="nome" name="nome">

            <br><br>

            <label for="cpf">CPF:</label>
            <span class="ast1">*</span>
            <br>
            <input type="text" id="cpf" name="cpf" maxlength="11" pattern="[0-9]{11}">

            <br><br>

            <label for="email">E-mail:</label>
            <span class="ast1">*</span>
            <br>
            <input type="email" id="email" name="email">

            <br><br>

            <label for="dataNascimento">Data de Nascimento:</label>
            <span class="ast1">*</span>
            <br>
            <input type="date" id="dataNascimento" name="dataNascimento">

            <br><br>

            <label for="status">Status:</label>
            <span class="ast1">*</span>
            <br>

            <select id="status" name="status">
                <option value="">Selecione o status</option>
                <option value="Ativo">Ativo</option>
                <option value="Inativo">Inativo</option>
                <option value="Pendente">Pendente</option>
            </select>

            <br><br>

            <label for="senha">Senha temporária:</label>
            <span class="ast1">*</span>
            <br>

            <input type="password" id="senha" name="senha" minlength="8" required>

            <br><br>

            <button style="background-color: green; color: white;" type="submit">
                Adicionar um usuário
            </button>

            <br><br>

            <button style="background-color: red; color: white;" type="reset">
                Cancelar
            </button>

        </form>

    </main>

    <footer>
    </footer>

</body>

</html>
